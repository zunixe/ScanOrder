name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  FLUTTER_VERSION: '3.41.8'

jobs:
  # ─── Analyze & Test ────────────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # - name: Check formatting
      #   run: dart format --set-exit-if-changed lib/ test/

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          # Remove generated files and platform-dependent files from coverage
          lcov --remove coverage/lcov.info '*.g.dart' '*.freezed.dart' -o coverage/lcov_filtered.info 2>/dev/null || true
          # Calculate line coverage from filtered lcov
          TOTAL_LINES=0
          COVERED_LINES=0
          while IFS= read -r line; do
            if [[ "$line" == DA:* ]]; then
              TOTAL_LINES=$((TOTAL_LINES + 1))
              HIT=$(echo "$line" | cut -d',' -f2)
              if [[ "$HIT" -gt 0 ]]; then
                COVERED_LINES=$((COVERED_LINES + 1))
              fi
            fi
          done < coverage/lcov_filtered.info
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "No coverage data found"
            exit 1
          fi
          PERCENT=$((COVERED_LINES * 100 / TOTAL_LINES))
          echo "Coverage: ${PERCENT}% (${COVERED_LINES}/${TOTAL_LINES} lines)"
          if [ "$PERCENT" -lt 40 ]; then
            echo "::error::Coverage ${PERCENT}% is below 40% threshold"
            exit 1
          elif [ "$PERCENT" -lt 80 ]; then
            echo "::warning::Coverage ${PERCENT}% is below 80% target"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  # ─── Build Android ──────────────────────────────────────────────────
  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Build APK (debug)
        if: github.ref == 'refs/heads/dev'
        run: flutter build apk --debug --dart-define-from-file=.env

      - name: Build AAB (release)
        if: github.ref == 'refs/heads/main'
        run: flutter build appbundle --release --dart-define-from-file=.env

      - name: Upload AAB
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK (debug)
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/*.apk

  # ─── Build iOS ──────────────────────────────────────────────────────
  build-ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --dart-define-from-file=.env

  # ─── Deploy to Play Store ───────────────────────────────────────────
  deploy:
    name: Deploy to Play Store
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Deploy to Play Store Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.scanorder.scanorder
          releaseFiles: app-release.aab
          track: internal
          status: completed
